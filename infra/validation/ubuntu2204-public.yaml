apiVersion: karpenter.azure.com/v1beta1
kind: AKSNodeClass
metadata:
  name: custom-ubuntu2204-public
spec:
  imageFamily: Ubuntu2204
  imageID: ${CUSTOM_IMAGE_ID}
  nodePublicIP:
    enabled: true
  osDiskSizeGB: 128
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: ubuntu2204-public
spec:
  limits:
    cpu: '4'
  template:
    spec:
      nodeClassRef:
        group: karpenter.azure.com
        kind: AKSNodeClass
        name: custom-ubuntu2204-public
      taints:
        - key: validation-only
          value: 'true'
          effect: NoSchedule
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: [amd64]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: [Standard_D4ds_v6]
        - key: karpenter.sh/capacity-type
          operator: In
          values: [on-demand]
        - key: topology.kubernetes.io/zone
          operator: In
          values: [eastus2-1]
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 5m
---
apiVersion: v1
kind: Namespace
metadata:
  name: validation2204
---
apiVersion: v1
kind: Pod
metadata:
  name: probe
  namespace: validation2204
spec:
  automountServiceAccountToken: false
  nodeSelector:
    karpenter.sh/nodepool: ubuntu2204-public
  tolerations:
    - key: validation-only
      operator: Equal
      value: 'true'
      effect: NoSchedule
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: probe
      image: curlimages/curl:8.14.1
      command: [sh, -c, 'exec tail -f /dev/null']
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 256Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]