apiVersion: v1
kind: Namespace
metadata:
  name: validation
---
apiVersion: v1
kind: Pod
metadata:
  name: probe
  namespace: validation
spec:
  automountServiceAccountToken: false
  nodeSelector:
    karpenter.sh/nodepool: validation
  tolerations:
    - key: validation-only
      operator: Equal
      value: 'true'
      effect: NoSchedule
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: probe
      image: curlimages/curl:8.14.1
      command: [sh, -c, 'exec tail -f /dev/null']
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 250m
          memory: 256Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      volumeMounts:
        - name: image-marker
          mountPath: /host-image
          readOnly: true
  volumes:
    - name: image-marker
      hostPath:
        path: /opt/karpenter-custom-image
        type: DirectoryOrCreate